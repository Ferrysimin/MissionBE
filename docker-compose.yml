version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_edu_course
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: edu_course
    ports:
      - "3306:3306"
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/1-database.sql
  